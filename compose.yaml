services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inkengine_dispatch
      POSTGRES_USER: inkengine
      POSTGRES_PASSWORD: inkengine
    ports:
      - '5432:5432'
    volumes:
      - inkengine_dispatch_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inkengine -d inkengine_dispatch']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  inkengine_dispatch_data: